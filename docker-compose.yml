version: '3.8'

services:
  app:
    build: .
    container_name: innopolis-events
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=3000

  nginx:
    image: nginx:alpine
    container_name: innopolis-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: innopolis-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/lib/letsencrypt --email admin@csrn-market.com --agree-tos --no-eff-email -d csrn-market.com

volumes:
  app-data:
  certbot-etc:
  certbot-var:
